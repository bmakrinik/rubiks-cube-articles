name: Sync Substack Articles

on:
  schedule:
    - cron: '0 8 * * *'  # Runs daily at 8am UTC
  workflow_dispatch:       # Also allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 markdownify feedparser

      - name: Sync new articles
        run: python sync.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/ README.md
          git diff --staged --quiet || git commit -m "sync: add new articles from Substack"
          git push
